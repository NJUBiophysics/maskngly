[project]
name = "maskngly"
version = "0.1.0"
description = "ESM-2 single-mask influence analysis for protein N-glycosylation sites"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
inference = ["fair-esm==2.0.0", "torch>=2.2,<3"]
plot = ["matplotlib>=3.8,<4"]
evaluation = ["scikit-learn>=1.4,<2"]

[project.scripts]
maskngly = "maskngly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskngly"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
